<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#090F1E" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Contador" />
  <title>Contador de Contagem Rápida</title>
  <style>
    :root {
      --bg: #EEF2FF;
      --bg-grad: linear-gradient(180deg, #E0E7FF 0%, #F8FAFC 45%, #EFF6FF 100%);
      --card: #FFFFFF;
      --card-2: #F1F5F9;
      --text: #0F172A;
      --muted: #475569;
      --accent: #2563EB;
      --accent-2: #06B6D4;
      --accent-soft: rgba(37, 99, 235, 0.14);
      --border: #CBD5E1;
      --danger: #E11D48;
      --ok: #10B981;
      --shadow: 0 18px 36px -16px rgba(37, 99, 235, 0.22);
    }
    body.dark {
      --bg: #060A14;
      --bg-grad: linear-gradient(180deg, #0D172E 0%, #070C18 52%, #091326 100%);
      --card: #111A2E;
      --card-2: #17233D;
      --text: #F8FAFC;
      --muted: #94A3B8;
      --accent: #3B82F6;
      --accent-2: #22D3EE;
      --accent-soft: rgba(59, 130, 246, 0.18);
      --border: #1E2E4D;
      --danger: #FB7185;
      --ok: #34D399;
      --shadow: 0 22px 46px -16px rgba(0, 0, 0, 0.75);
    }
    body[data-pal="emerald"] { --accent: #059669; --accent-2: #10B981; --accent-soft: rgba(16, 185, 129, 0.16); }
    body.dark[data-pal="emerald"] { --accent: #10B981; --accent-2: #34D399; --accent-soft: rgba(16, 185, 129, 0.2); }
    body[data-pal="violet"] { --accent: #7C3AED; --accent-2: #A855F7; --accent-soft: rgba(139, 92, 246, 0.16); }
    body.dark[data-pal="violet"] { --accent: #8B5CF6; --accent-2: #C084FC; --accent-soft: rgba(139, 92, 246, 0.2); }
    body[data-pal="amber"] { --accent: #D97706; --accent-2: #F59E0B; --accent-soft: rgba(245, 158, 11, 0.16); }
    body.dark[data-pal="amber"] { --accent: #F59E0B; --accent-2: #FBBF24; --accent-soft: rgba(245, 158, 11, 0.2); }
    body[data-pal="rose"] { --accent: #E11D48; --accent-2: #F43F5E; --accent-soft: rgba(244, 63, 94, 0.16); }
    body.dark[data-pal="rose"] { --accent: #F43F5E; --accent-2: #FB7185; --accent-soft: rgba(244, 63, 94, 0.2); }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100dvh; overflow: hidden;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg); background-image: var(--bg-grad); color: var(--text);
      user-select: none;
    }
    button, input, textarea, select { font-family: inherit; touch-action: manipulation; }
    button { cursor: pointer; }
    button:disabled { opacity: 0.38; pointer-events: none; }

    .app {
      height: 100dvh; width: 100%; max-width: 520px; margin: 0 auto;
      padding: 8px 10px 8px;
      display: flex; flex-direction: column; justify-content: space-between; gap: 8px;
    }

    .row-top { display: flex; align-items: center; justify-content: space-between; gap: 5px; flex-shrink: 0; }
    .steps {
      display: flex; align-items: center; gap: 2px; padding: 3px; border-radius: 14px;
      background: var(--card); border: 1px solid var(--border);
    }
    .step-btn {
      border: none; background: transparent; color: var(--muted); font-weight: 800;
      font-size: 0.7rem; padding: 6px 6px; border-radius: 11px; white-space: nowrap;
    }
    .step-btn.active {
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: #FFFFFF; box-shadow: 0 4px 12px var(--accent-soft);
    }
    .right-tools { display: flex; align-items: center; gap: 4px; margin-left: auto; }
    .tool-btn {
      display: inline-flex; align-items: center; gap: 4px; padding: 7px 7px; border-radius: 14px;
      background: var(--card); border: 1px solid var(--border); color: var(--text);
      font-size: 0.72rem; font-weight: 800; white-space: nowrap;
    }
    .avatar-btn {
      padding: 2px; width: 32px; height: 32px; border-radius: 11px;
      background: var(--card); border: 2px solid var(--accent);
      display: inline-flex; align-items: center; justify-content: center; overflow: hidden;
      flex-shrink: 0;
    }
    .avatar-btn img { width: 100%; height: 100%; object-fit: cover; border-radius: 8px; display: block; }
    .avatar-face { font-size: 0.86rem; font-weight: 900; line-height: 1; }

    .frame-blue { border-color: #3B82F6 !important; box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.22); color: #60A5FA; }
    .frame-emerald { border-color: #10B981 !important; box-shadow: 0 0 0 2px rgba(16, 185, 129, 0.24); color: #34D399; }
    .frame-violet { border-color: #8B5CF6 !important; box-shadow: 0 0 0 2px rgba(139, 92, 246, 0.24); color: #C084FC; }
    .frame-amber { border-color: #F59E0B !important; box-shadow: 0 0 0 2px rgba(245, 158, 11, 0.24); color: #FBBF24; }
    .frame-rose { border-color: #F43F5E !important; box-shadow: 0 0 0 2px rgba(244, 63, 94, 0.24); color: #FB7185; }

    .lock-btn.locked {
      border-color: var(--danger);
      background: rgba(244, 63, 94, 0.16);
      color: var(--danger);
    }
    .badge {
      padding: 2px 5px; border-radius: 999px; font-size: 0.64rem; font-weight: 800;
      background: var(--accent-soft); color: var(--accent);
    }

    .mic-btn {
      position: relative;
      display: inline-flex; align-items: center; justify-content: center;
      padding: 7px 8px; border-radius: 14px;
      background: var(--card); border: 1.5px solid var(--border);
      color: #64748B; transition: all 0.15s ease;
    }
    .mic-dot {
      position: absolute; top: 4px; right: 4px;
      width: 6px; height: 6px; border-radius: 50%;
      background: #64748B; transition: all 0.15s ease;
    }
    .mic-btn.on {
      color: #10B981;
      border-color: rgba(16, 185, 129, 0.5);
      background: rgba(16, 185, 129, 0.14);
      box-shadow: 0 0 14px rgba(16, 185, 129, 0.25);
    }
    .mic-btn.on .mic-dot {
      background: #10B981;
      box-shadow: 0 0 8px rgba(16, 185, 129, 0.9);
    }

    .stage {
      position: relative; flex: 1; min-height: 0; border-radius: 26px;
      background: linear-gradient(160deg, var(--card) 0%, var(--card-2) 100%);
      border: 1.5px solid var(--border); box-shadow: var(--shadow);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 16px; text-align: center; overflow: hidden; cursor: pointer;
      transition: border-color 0.2s ease;
    }
    .stage.goal-hit { border-color: rgba(16, 185, 129, 0.65); }
    .stage:active { transform: scale(0.992); }
    .stage-meta-bar {
      position: absolute; top: 10px; left: 12px; right: 12px; z-index: 3;
      display: flex; justify-content: space-between; align-items: center; gap: 6px;
      pointer-events: none; font-size: 0.64rem; font-weight: 800; color: var(--muted);
    }
    .tiny-pill {
      padding: 2px 7px; border-radius: 999px;
      background: var(--card); border: 1px solid var(--border);
      color: var(--muted); font-variant-numeric: tabular-nums;
    }
    .sup-pill {
      display: none;
      padding: 2px 7px; border-radius: 999px;
      background: rgba(139, 92, 246, 0.18); border: 1px solid rgba(139, 92, 246, 0.48);
      color: #C084FC; font-weight: 900; letter-spacing: 0.03em;
    }
    body.supervision .sup-pill { display: inline-block; }

    .stage-inner {
      position: relative; z-index: 2; pointer-events: none; width: 100%;
      display: flex; flex-direction: column; align-items: center; gap: 8px;
    }
    .item-chip {
      display: none; padding: 4px 12px; border-radius: 999px;
      background: var(--accent-soft); color: var(--accent); font-size: 0.74rem; font-weight: 800;
      max-width: 90%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .item-chip.show { display: inline-block; }
    .big-num {
      font-size: clamp(4.2rem, 18vw, 6.4rem); font-weight: 900; line-height: 1;
      letter-spacing: -0.04em; font-variant-numeric: tabular-nums;
      background: linear-gradient(135deg, var(--text) 20%, var(--accent) 130%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      transition: transform 0.12s ease;
    }
    body.dark .big-num {
      background: linear-gradient(135deg, #FFFFFF 25%, var(--accent-2) 140%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .big-num.bump { transform: scale(1.05); }
    .hint-chip {
      padding: 6px 14px; border-radius: 999px;
      background: var(--accent-soft); border: 1px solid var(--border);
      color: var(--text); font-size: 0.78rem; font-weight: 700;
    }
    .feedback { font-size: 0.75rem; color: var(--muted); min-height: 16px; font-weight: 600; }
    body.minimal .hint-chip,
    body.minimal .feedback,
    body.minimal .item-chip,
    body.minimal .stage-meta-bar { display: none !important; }

    .goal-box { display: none; margin-top: 2px; width: 100%; max-width: 270px; }
    .goal-box.show { display: block; }
    .goal-top { display: flex; justify-content: space-between; align-items: center; gap: 6px; font-size: 0.72rem; font-weight: 700; color: var(--muted); margin-bottom: 4px; }
    .goal-track { height: 7px; border-radius: 999px; background: var(--card); overflow: hidden; border: 1px solid var(--border); }
    .goal-fill { height: 100%; width: 0%; background: linear-gradient(90deg, var(--accent), var(--accent-2)); border-radius: 999px; transition: width 0.2s ease; }
    .goal-fill.done { background: var(--ok); }
    .ripple {
      position: absolute; width: 170px; height: 170px; border-radius: 50%;
      background: radial-gradient(circle, var(--accent-soft) 0%, transparent 70%);
      transform: translate(-50%, -50%) scale(0.2);
      animation: rip 0.45s ease-out forwards; pointer-events: none; z-index: 1;
    }
    @keyframes rip { to { transform: translate(-50%, -50%) scale(1.6); opacity: 0; } }

    .bottom { display: flex; flex-direction: column; gap: 6px; flex-shrink: 0; transition: all 0.18s ease; }
    body.one-hand .bottom {
      width: 78%;
      margin-left: 0;
      margin-right: auto;
      padding-bottom: 4px;
    }
    body.one-hand .b-card,
    body.one-hand .b-primary {
      padding-top: 11px;
      padding-bottom: 11px;
      font-size: 0.78rem;
    }

    .g4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
    .g4-2 { display: grid; grid-template-columns: 0.85fr 0.85fr 1fr 1.55fr; gap: 6px; }
    .b-card {
      padding: 13px 6px; border-radius: 15px; background: var(--card); border: 1px solid var(--border);
      color: var(--text); font-size: 0.84rem; font-weight: 800; white-space: nowrap;
    }
    .b-card:active { transform: scale(0.96); }
    .b-plus { border-color: var(--accent); color: var(--accent); }
    .b-minus { border-color: rgba(245, 158, 11, 0.35); }
    .b-accent { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
    .b-danger { background: rgba(244, 63, 94, 0.1); border-color: rgba(244, 63, 94, 0.35); color: var(--danger); }
    .b-primary {
      padding: 13px 10px; border-radius: 15px; border: none;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: #FFFFFF; font-size: 0.84rem; font-weight: 800; white-space: nowrap;
      box-shadow: 0 8px 20px -6px var(--accent-soft);
    }
    .b-primary:active { transform: scale(0.96); }

    body.locked .stage,
    body.locked .bottom button {
      opacity: 0.45;
      pointer-events: none;
    }

    .modal {
      position: fixed; inset: 0; z-index: 60; background: rgba(2, 6, 23, 0.72);
      backdrop-filter: blur(5px);
      display: none; align-items: center; justify-content: center; padding: 14px;
    }
    .modal.open { display: flex; }
    .sheet {
      position: relative; overflow: hidden;
      width: 100%; max-width: 440px; max-height: 86dvh; overflow-y: auto;
      border-radius: 24px;
      background:
        radial-gradient(circle at 100% 0%, rgba(16, 185, 129, 0.14), transparent 45%),
        radial-gradient(circle at 0% 100%, rgba(59, 130, 246, 0.14), transparent 48%),
        var(--card);
      border: 1.5px solid var(--border);
      padding: 16px; box-shadow: var(--shadow);
    }
    .sheet-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; gap: 8px; }
    .sheet-title { font-size: 0.98rem; font-weight: 800; margin: 0; }
    .x-btn {
      border: 1px solid var(--border); background: var(--card-2); color: var(--muted);
      border-radius: 11px; padding: 6px 10px; font-weight: 700; font-size: 0.78rem;
    }
    .inp, .ta, .sel {
      width: 100%; padding: 11px 13px; border-radius: 13px;
      border: 1px solid var(--border); background: var(--card-2); color: var(--text);
      font-size: 0.92rem; font-weight: 700; outline: none;
    }
    .ta { min-height: 88px; resize: vertical; font-size: 0.78rem; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    .inp:focus, .ta:focus, .sel:focus { border-color: var(--accent); }
    .q-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin: 10px 0; }
    .q-btn {
      padding: 8px; border-radius: 11px; border: 1px solid var(--border);
      background: var(--card-2); color: var(--text); font-size: 0.78rem; font-weight: 700;
    }
    .mode-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
    .mode-btn {
      padding: 10px 8px; border-radius: 13px; border: 1.5px solid var(--border);
      background: var(--card-2); color: var(--muted); font-size: 0.78rem; font-weight: 800;
    }
    .mode-btn.active {
      border-color: var(--accent); background: var(--accent-soft); color: var(--text);
    }
    .m-actions { display: flex; gap: 8px; margin-top: 12px; }
    .m-actions > * { flex: 1; }
    .h-item {
      padding: 11px 12px; border-radius: 15px; background: var(--card-2); border: 1px solid var(--border);
      margin-bottom: 8px; display: flex; flex-direction: column; gap: 8px;
    }
    .h-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
    .h-val { font-size: 1.15rem; font-weight: 850; color: var(--accent); font-variant-numeric: tabular-nums; }
    .h-btns { display: flex; justify-content: flex-end; gap: 5px; flex-wrap: wrap; align-items: center; }
    .s-btn {
      padding: 6px 9px; border-radius: 10px; border: 1px solid var(--border);
      background: var(--card); color: var(--text); font-size: 0.72rem; font-weight: 700;
    }
    .s-btn.on { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }

    .dgoal-card {
      padding: 11px 12px; border-radius: 15px; background: var(--card-2);
      border: 1px solid var(--border); margin-top: 8px;
      display: flex; flex-direction: column; gap: 8px;
    }
    .dgoal-card.focus { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent-soft); }
    .dgoal-card.done { border-color: rgba(16, 185, 129, 0.55); }
    .dgoal-card.off { opacity: 0.62; }
    .dgoal-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .dgoal-name { font-size: 0.86rem; font-weight: 800; word-break: break-word; }
    .dgoal-target { font-size: 0.96rem; font-weight: 850; color: var(--accent); white-space: nowrap; }
    .dgoal-foot { display: flex; justify-content: space-between; align-items: center; gap: 6px; flex-wrap: wrap; }

    .cfg-row {
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
      padding: 12px; border-radius: 15px; background: var(--card-2); border: 1px solid var(--border);
      margin-bottom: 8px;
    }
    .cfg-title { font-size: 0.86rem; font-weight: 800; }
    .cfg-desc { font-size: 0.72rem; color: var(--muted); margin-top: 2px; }
    .sw {
      width: 44px; height: 26px; border-radius: 999px; border: none; padding: 3px;
      background: #475569; position: relative; transition: background 0.15s ease; flex-shrink: 0;
    }
    .sw.on { background: var(--ok); }
    .sw-knob {
      width: 20px; height: 20px; border-radius: 50%; background: #FFFFFF;
      display: block; transform: translateX(0); transition: transform 0.15s ease;
    }
    .sw.on .sw-knob { transform: translateX(18px); }
    .pal-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
    .pal-dot {
      width: 28px; height: 28px; border-radius: 999px; border: 2px solid transparent;
    }
    .pal-dot.active { border-color: var(--text); transform: scale(1.1); }

    .secret-box {
      display: none;
      margin-top: 10px;
      padding: 12px;
      border-radius: 16px;
      background: linear-gradient(155deg, rgba(67, 20, 140, 0.28), rgba(15, 23, 42, 0.75));
      border: 1.5px solid rgba(139, 92, 246, 0.45);
    }
    .secret-box.open { display: block; }
    .secret-msg {
      font-size: 0.72rem;
      color: var(--muted);
      margin-top: 6px;
      min-height: 16px;
      font-weight: 700;
    }

    /* Painel de ADM completo */
    .adm-modal { z-index: 80; }
    .adm-sheet {
      width: 100%; max-width: 500px; max-height: 92dvh; overflow-y: auto;
      border-radius: 26px;
      background:
        radial-gradient(circle at 0% 0%, rgba(124, 58, 237, 0.34), transparent 46%),
        radial-gradient(circle at 100% 100%, rgba(16, 185, 129, 0.22), transparent 50%),
        #0B0820;
      border: 1.5px solid rgba(139, 92, 246, 0.55);
      color: #F8FAFC;
      padding: 16px;
      box-shadow: 0 28px 60px rgba(0, 0, 0, 0.85);
    }
    .adm-header {
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
      padding-bottom: 12px; border-bottom: 1px solid rgba(139, 92, 246, 0.3);
      margin-bottom: 12px;
    }
    .adm-user { display: flex; align-items: center; gap: 10px; }
    .adm-avatar {
      width: 42px; height: 42px; border-radius: 14px;
      background: linear-gradient(135deg, #6D28D9, #2563EB);
      display: flex; align-items: center; justify-content: center;
      font-weight: 900; font-size: 1rem; color: #FFFFFF;
      box-shadow: 0 0 18px rgba(109, 40, 217, 0.55);
    }
    .adm-nav {
      display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px;
      background: rgba(23, 18, 56, 0.9);
      padding: 4px; border-radius: 15px;
      border: 1px solid rgba(139, 92, 246, 0.32);
      margin-bottom: 12px;
    }
    .adm-tab {
      border: none; background: transparent; color: #A5B4FC;
      font-size: 0.72rem; font-weight: 800; padding: 8px 4px; border-radius: 11px;
    }
    .adm-tab.active {
      background: linear-gradient(135deg, #6D28D9, #4F46E5);
      color: #FFFFFF;
      box-shadow: 0 4px 12px rgba(109, 40, 217, 0.45);
    }
    .adm-pane { display: none; }
    .adm-pane.active { display: block; }

      border: 1px solid rgba(139, 92, 246, 0.3);

    .adm-kpi-label { font-size: 0.68rem; font-weight: 800; color: #A5B4FC; text-transform: uppercase; letter-spacing: 0.04em; }
    .adm-kpi-val { font-size: 1.25rem; font-weight: 900; color: #FFFFFF; margin-top: 3px; font-variant-numeric: tabular-nums; }
    .adm-kpi-sub { font-size: 0.68rem; color: #34D399; margin-top: 2px; font-weight: 700; }
    .adm-card {
      padding: 12px; border-radius: 16px;

      border: 1px solid rgba(139, 92, 246, 0.32);
      margin-bottom: 10px;
    }
    .adm-card-title { font-size: 0.84rem; font-weight: 850; color: #F8FAFC; margin-bottom: 4px; }
    .adm-card-desc { font-size: 0.72rem; color: #94A3B8; margin-bottom: 8px; line-height: 1.35; }

                      <script>
    const STORE_KEY = 'contador_perfis_v16';
    const SECRET_CODE = '1327';

    function todayKey() {
      const d = new Date();
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    }

    function defaultAdminConfig() {
      return {
        supervision: false,
        maxProfiles: 3,
        maxCount: 0,
        idleLockMinutes: 0,
        logs: []
      };
    }

    function defaultProfileData(name = 'Perfil 1', photo = '', frame = 'blue') {
      return {
        name,
        photo,
        frame,
        protected: false,
        count: 0,
        step: 10,
        goal: null,
        goalName: '',
        goalMode: 'once',
        goalDay: todayKey(),
        goalCompleted: false,
        activeDailyId: null,
        dailyGoals: [],
        dark: true,
        palette: 'blue',
        locked: false,
        activeLabel: null,
        lastText: 'Pronto para contar',
        history: [],
        cfg: {
          oneHand: false,
          sound: true,
          wakeLock: false,
          vibrate: true,
          minimal: false,
          hwKeys: true
        }
      };
    }

    let root = {
      onboardingDone: false,
      activeProfileId: 'p1',
      admin: defaultAdminConfig(),
      profiles: [
        { id: 'p1', ...defaultProfileData('Principal', '', 'blue') }
      ]
    };

    let state = root.profiles[0];
    let showPickerOnOpen = true;

    let initDraftName = '';
    let initDraftPhoto = '';
    let initDraftFrame = 'blue';

    let draftGoalMode = 'once';
    let editingDailyIdx = null;
    let draftValMode = 'add';
    let editingHistIdx = null;
    let onlyToday = false;
    let prevSnapshot = null;
    let wakeSentinel = null;
    let audioCtx = null;

    let sessionStartMs = null;
    let sessionElapsedSec = 0;
    let tapIntervals = [];
    let lastTapMs = null;
    let paceLabel = 'Ritmo: --';
    let lastActivityMs = Date.now();

    let formProfileId = null;
    let draftProfName = '';
    let draftProfPhoto = '';
    let draftProfFrame = 'blue';

    let cfgTapCount = 0;
    let cfgTapTimer = null;
    let admUnlocked = false;
    let activeAdmTab = 'dash';

    let armSelectiveKey = null;
    let armSelectiveTimer = null;
    let armRestoreBackup = false;
    let armRestoreTimer = null;
    let armClearAdmLog = false;
    let armClearAdmLogTimer = null;

    let armResetTimer = null;
    let resetArmed = false;
    let armClearHist = false;
    let clearHistTimer = null;
    let armClearGoals = false;
    let clearGoalsTimer = null;
    let armedHistDelIdx = null;
    let histDelTimer = null;
    let armedGoalDelIdx = null;
    let goalDelTimer = null;
    let armDelProfile = false;
    let delProfileTimer = null;

    function getMaxProfiles() {
      const m = parseInt(root.admin && root.admin.maxProfiles, 10);
      return Number.isFinite(m) ? Math.min(10, Math.max(1, m)) : 3;
    }

    function isSupervisionOn() {
      return Boolean(root.admin && root.admin.supervision);
    }

    function logAdminAction(action) {
      if (!root.admin) root.admin = defaultAdminConfig();
      if (!Array.isArray(root.admin.logs)) root.admin.logs = [];
      root.admin.logs.unshift({
        id: Date.now() + Math.random(),
        at: new Date().toLocaleString('pt-BR'),
        profile: state ? state.name : 'Sistema',
        action
      });
      if (root.admin.logs.length > 80) root.admin.logs.length = 80;
    }

    function showAdmToast(msg) {
      const el = document.getElementById('adm-toast');
      if (el) el.textContent = msg || '';
    }

    function resetSecretPanel() {
      cfgTapCount = 0;
      if (cfgTapTimer) { clearTimeout(cfgTapTimer); cfgTapTimer = null; }
      const box = document.getElementById('secret-reset-box');
      const inp = document.getElementById('inp-secret-pass');
      const msg = document.getElementById('secret-msg');
      if (box) box.classList.remove('open');
      if (inp) inp.value = '';
      if (msg) msg.textContent = '';
    }

    function onCfgTitleTap() {
      cfgTapCount += 1;
      if (cfgTapTimer) clearTimeout(cfgTapTimer);
      cfgTapTimer = setTimeout(() => { cfgTapCount = 0; }, 1800);

      if (cfgTapCount >= 5) {
        cfgTapCount = 0;
        const box = document.getElementById('secret-reset-box');
        const inp = document.getElementById('inp-secret-pass');
        const msg = document.getElementById('secret-msg');
        if (box) {
          box.classList.add('open');
          if (msg) msg.textContent = 'Digite a senha de ADM.';
          if (inp) { inp.value = ''; inp.focus(); }
        }
      }
    }

    function checkSecretPass() {
      const inp = document.getElementById('inp-secret-pass');
      const msg = document.getElementById('secret-msg');
      const typed = String((inp && inp.value) || '').trim();

      if (typed === SECRET_CODE) {
        admUnlocked = true;
        resetSecretPanel();
        closeModal('m-cfg');
        openAdmPanel();
      } else {
        admUnlocked = false;
        if (msg) msg.textContent = 'Senha incorreta.';
      }
    }

    function openAdmPanel() {
      if (!admUnlocked) return;
      activeAdmTab = 'dash';
      showAdmToast('');
      resetAdmConfirmations();
      renderAdmPanel();
      document.getElementById('m-adm').classList.add('open');
    }

    function closeAdmPanel() {
      admUnlocked = false;
      resetAdmConfirmations();
      document.getElementById('m-adm').classList.remove('open');
      render();
    }

    function switchAdmTab(tab) {
      activeAdmTab = tab;
      resetAdmConfirmations();
      ['dash', 'manip', 'rules', 'sys'].forEach(t => {
        const b = document.getElementById('adm-tab-' + t);
        const p = document.getElementById('adm-pane-' + t);
        if (b) b.classList.toggle('active', t === tab);
        if (p) p.classList.toggle('active', t === tab);
      });
      renderAdmPanel();
    }

    function resetAdmConfirmations() {
      armSelectiveKey = null;
      if (armSelectiveTimer) { clearTimeout(armSelectiveTimer); armSelectiveTimer = null; }
      const mapSel = {
        count: 'Zerar Contador',
        history: 'Limpar Histórico',
        goals: 'Limpar Metas',
        log: 'Limpar Log ADM'
      };
      Object.keys(mapSel).forEach(k => {
        const b = document.getElementById('btn-sel-reset-' + k);
        if (b) b.textContent = mapSel[k];
      });

      armRestoreBackup = false;
      if (armRestoreTimer) { clearTimeout(armRestoreTimer); armRestoreTimer = null; }
      const br = document.getElementById('btn-adm-restore');
      if (br) br.textContent = 'Restaurar Sistema';

      armClearAdmLog = false;
      if (armClearAdmLogTimer) { clearTimeout(armClearAdmLogTimer); armClearAdmLogTimer = null; }
      const bl = document.getElementById('btn-clear-adm-log');
      if (bl) bl.textContent = 'Limpar';
    }

    function renderAdmPanel() {
      if (!admUnlocked) return;
      document.getElementById('adm-sub-status').textContent =
        `Perfil ativo: ${state.name} · ${isSupervisionOn() ? 'Supervisão ATIVA' : 'Supervisão desligada'}`;

      const profSum = state.history.reduce((a, b) => a + (Number(b.value) || 0), 0);
      const allHistSum = root.profiles.reduce((acc, p) => {
        const s = (p.history || []).reduce((x, y) => x + (Number(y.value) || 0), 0);
        return acc + s + (Number(p.count) || 0);
      }, 0);
      const bytes = new Blob([JSON.stringify(root)]).size;
      const kb = (bytes / 1024).toFixed(1);

      document.getElementById('kpi-cur-count').textContent = state.count.toLocaleString('pt-BR');
      document.getElementById('kpi-cur-prof').textContent = state.name;
      document.getElementById('kpi-prof-sum').textContent = profSum.toLocaleString('pt-BR');
      document.getElementById('kpi-prof-regs').textContent = `${state.history.length} registros`;
      document.getElementById('kpi-all-sum').textContent = allHistSum.toLocaleString('pt-BR');
      document.getElementById('kpi-all-profs').textContent = `${root.profiles.length} ${root.profiles.length === 1 ? 'perfil' : 'perfis'}`;
      document.getElementById('kpi-storage-kb').textContent = `${kb} KB`;
      document.getElementById('kpi-goals-count').textContent = `${state.dailyGoals.length} metas diárias`;

      const maxP = getMaxProfiles();
      const capPct = Math.min(100, Math.round((root.profiles.length / maxP) * 100));
      document.getElementById('adm-cap-summary').textContent =
        `Perfis: ${root.profiles.length} / ${maxP} · Teto contador: ${root.admin.maxCount > 0 ? root.admin.maxCount.toLocaleString('pt-BR') : 'Livre'} · Supervisão: ${isSupervisionOn() ? 'ATIVA' : 'Desligada'}`;
      document.getElementById('adm-cap-bar').style.width = capPct + '%';

      const logs = root.admin.logs || [];
      document.getElementById('adm-log-count').textContent = logs.length;
      const logBox = document.getElementById('adm-log-list');
      logBox.innerHTML = !logs.length
        ? '<div style="font-size:0.74rem;color:#94A3B8;text-align:center;padding:10px 0;">Nenhuma ação administrativa registrada ainda.</div>'
        : logs.map(l => `
          <div class="adm-log-row">
            <div style="display:flex;justify-content:space-between;gap:6px;color:#A5B4FC;font-size:0.66rem;font-weight:800;">
              <span>${l.profile}</span>
              <span>${l.at}</span>
            </div>
            <div style="color:#F8FAFC;margin-top:2px;font-weight:700;">${l.action}</div>
          </div>`).join('');

      // Aba Manipular: seletor de histórico
      const sel = document.getElementById('adm-edit-hist-sel');
      if (sel) {
        if (!state.history.length) {
          sel.innerHTML = '<option value="">Sem registros no histórico</option>';
          document.getElementById('adm-edit-hist-label').value = '';
          document.getElementById('adm-edit-hist-val').value = '';
          document.getElementById('adm-edit-hist-date').value = '';
        } else {
          const prevIdx = sel.value;
          sel.innerHTML = state.history.map((h, i) =>
            `<option value="${i}">#${i + 1} · ${h.label} (${Number(h.value || 0).toLocaleString('pt-BR')})</option>`
          ).join('');
          if (prevIdx !== '' && state.history[Number(prevIdx)]) sel.value = prevIdx;
          admLoadSelectedHistItem();
        }
      }

      // Aba Regras / Capacidade
      const swSup = document.getElementById('sw-adm-supervision');
      if (swSup) swSup.classList.toggle('on', isSupervisionOn());
      const supTxt = document.getElementById('adm-sup-state-txt');
      if (supTxt) supTxt.textContent = isSupervisionOn() ? 'Supervisão ATIVA (travas ligadas)' : 'Supervisão desativada';

      document.getElementById('adm-max-profiles').value = maxP;
      document.getElementById('adm-max-count').value = Number(root.admin.maxCount) || 0;
      document.getElementById('adm-idle-lock').value = String(Number(root.admin.idleLockMinutes) || 0);

      const lockList = document.getElementById('adm-prof-locks-list');
      if (lockList) {
        lockList.innerHTML = root.profiles.map(p => `
          <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 10px;border-radius:12px;background:rgba(12,10,34,0.85);border:1px solid rgba(139,92,246,0.24);">
            <div>
              <div style="font-size:0.8rem;font-weight:800;">${p.name} ${p.id === state.id ? '(Atual)' : ''}</div>

    function parseAndValidateRootBackup(rawText) {
      const parsed = JSON.parse(rawText);
      if (!parsed || !Array.isArray(parsed.profiles) || !parsed.profiles.length) {
        throw new Error('Estrutura de backup inválida (sem perfis).');
      }
      const totalRegs = parsed.profiles.reduce((a, p) => a + (Array.isArray(p.history) ? p.history.length : 0), 0);
      return { parsed, totalRegs };
    }

    function admPreviewBackupJson() {
      const txt = (document.getElementById('adm-backup-json').value || '').trim();
      const prevEl = document.getElementById('adm-backup-preview');
      if (!txt) {
        prevEl.textContent = 'Cole ou carregue um JSON primeiro.';
        return null;
      }
      try {
        const { parsed, totalRegs } = parseAndValidateRootBackup(txt);
        prevEl.textContent = `Válido: ${parsed.profiles.length} perfil(is) · ${totalRegs} registro(s) no histórico.`;
        return parsed;
      } catch (err) {
        prevEl.textContent = 'JSON inválido: ' + err.message;
        return null;
      }
    }

    function resizePhotoToDataUrl(file, cb) {
      const reader = new FileReader();
      reader.onload = () => {
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement('canvas');
          const max = 128;
          const ratio = Math.min(max / img.width, max / img.height, 1);
          canvas.width = Math.max(1, Math.round(img.width * ratio));
          canvas.height = Math.max(1, Math.round(img.height * ratio));
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
          cb(canvas.toDataURL('image/jpeg', 0.75));
        };
        img.src = reader.result;
      };
      reader.readAsDataURL(file);
    }

    function fmtTime(sec) {
      const s = Math.max(0, Math.floor(sec));
      const m = Math.floor(s / 60);
      const r = s % 60;
      return `${String(m).padStart(2, '0')}:${String(r).padStart(2, '0')}`;
    }

    function updateSessionAndPace(isIncrement) {
      const now = Date.now();
      lastActivityMs = now;
      if (!sessionStartMs && isIncrement) {
        sessionStartMs = now;
      }
      if (sessionStartMs) {
        sessionElapsedSec = Math.floor((now - sessionStartMs) / 1000);
      }
      if (isIncrement) {
        if (lastTapMs) {
          const dt = (now - lastTapMs) / 1000;
          if (dt > 0.04 && dt < 20) {
            tapIntervals.push(dt);
            if (tapIntervals.length > 6) tapIntervals.shift();
            const avg = tapIntervals.reduce((a, b) => a + b, 0) / tapIntervals.length;
            if (avg < 0.55) paceLabel = 'Ritmo: rápido';
            else if (avg > 1.8) paceLabel = 'Ritmo: lento';
            else paceLabel = 'Ritmo: normal';
          }
        }
        lastTapMs = now;
      }
    }

    setInterval(() => {
      if (sessionStartMs && !state.locked) {
        sessionElapsedSec = Math.floor((Date.now() - sessionStartMs) / 1000);
        const tp = document.getElementById('timer-pill');
        if (tp) tp.textContent = fmtTime(sessionElapsedSec);
      }
      const idleMin = Number(root.admin && root.admin.idleLockMinutes) || 0;
      if (idleMin > 0 && !state.locked && root.onboardingDone && !showPickerOnOpen) {
        if (Date.now() - lastActivityMs >= idleMin * 60 * 1000) {
          state.locked = true;
          state.lastText = `Tela travada por inatividade (${idleMin} min)`;
          saveState();
          render();
        }
      }
    }, 1000);

        dot.classList.toggle('active', dot.getAttribute('data-f') === draftProfFrame);
      });
      document.getElementById('btn-dup-prof').disabled = root.profiles.length >= maxP;
      document.getElementById('btn-del-prof').style.display =
        (formProfileId && root.profiles.length > 1 && !isProtected) ? 'inline-block' : 'none';
    }

    function switchProfile(id) {
      if (id === state.id) return;
      root.activeProfileId = id;
      syncActiveProfileRef();
      sessionStartMs = null;
      sessionElapsedSec = 0;
      tapIntervals = [];
      lastTapMs = null;
      paceLabel = 'Ritmo: --';
      prevSnapshot = null;
      disarmReset();
      saveState();
      renderProfilesModal();
      render(true);
    }

    function selectProfileForEdit(id) {
      const p = root.profiles.find(x => x.id === id);
      if (!p) return;
      formProfileId = p.id;
      draftProfName = p.name;
      draftProfPhoto = p.photo || '';
      draftProfFrame = p.frame || 'blue';
      renderProfilesModal();
    }

    function prepareNewProfile() {
      const maxP = getMaxProfiles();
      if (root.profiles.length >= maxP) {
        state.lastText = `Limite de ${maxP} perfis atingido`;
        render();
        return;
      }
      formProfileId = null;
      draftProfName = `Perfil ${root.profiles.length + 1}`;
      draftProfPhoto = '';
      draftProfFrame = 'emerald';
      renderProfilesModal();
    }

    function duplicateSelectedProfile() {
      const maxP = getMaxProfiles();
      if (root.profiles.length >= maxP) {
        state.lastText = `Limite de ${maxP} perfis atingido`;
        render();
        return;
      }
      const source = root.profiles.find(p => p.id === (formProfileId || state.id)) || state;
      const clonedData = JSON.parse(JSON.stringify(source));
      delete clonedData.id;
      clonedData.protected = false;
      clonedData.name = `${source.name || 'Perfil'} (Cópia)`.slice(0, 20);
      const copyProf = { id: 'p_' + Date.now(), ...clonedData };
      root.profiles.push(copyProf);
      root.activeProfileId = copyProf.id;
      syncActiveProfileRef();
      formProfileId = copyProf.id;
      draftProfName = copyProf.name;
      draftProfPhoto = copyProf.photo || '';
      draftProfFrame = copyProf.frame || 'blue';
      state.lastText = `Perfil "${copyProf.name}" duplicado`;
      saveState();
      renderProfilesModal();
      render();
    }

    function onPickProfilePhoto(e) {
      const f = e.target.files && e.target.files[0];
      if (!f) return;
      resizePhotoToDataUrl(f, (dataUrl) => {
        draftProfPhoto = dataUrl;
        renderProfilesModal();
      });
    }

    function clearProfilePhoto() {
      draftProfPhoto = '';
      renderProfilesModal();
    }

    function saveProfileForm() {
      const maxP = getMaxProfiles();
      const nameInput = (document.getElementById('inp-prof-name').value || '').trim();
      const finalName = nameInput || 'Perfil';

      if (formProfileId) {
        const p = root.profiles.find(x => x.id === formProfileId);
        if (p) {
          if (p.protected) {
            state.lastText = 'Perfil protegido pelo ADM';
            render();
            return;
          }
          p.name = finalName;
          p.photo = draftProfPhoto;
          p.frame = draftProfFrame;
          state.lastText = `Perfil "${finalName}" salvo`;
        }
      } else {
        if (root.profiles.length >= maxP) {
          state.lastText = `Máximo de ${maxP} perfis`;
          render();
          return;
        }
        const newP = { id: 'p_' + Date.now(), ...defaultProfileData(finalName, draftProfPhoto, draftProfFrame) };
        root.profiles.push(newP);
        root.activeProfileId = newP.id;
        formProfileId = newP.id;

        state.lastText = `Perfil "${finalName}" criado`;

      saveState();
      renderProfilesModal();

    function deleteCurrentProfile() {
      if (!formProfileId || root.profiles.length <= 1) return;
      const target = root.profiles.find(p => p.id === formProfileId);
      if (target && target.protected) {
        state.lastText = 'Perfil protegido pelo ADM';
        render();
        return;
      }
      const btn = document.getElementById('btn-del-prof');
      if (!armDelProfile) {
        resetConfirmations();
        armDelProfile = true;
        if (btn) btn.textContent = 'Certeza?';
        delProfileTimer = setTimeout(() => {
          armDelProfile = false;
          if (btn) btn.textContent = 'Excluir perfil';
        }, 3500);
        return;
      }
      resetConfirmations();
      const idx = root.profiles.findIndex(p => p.id === formProfileId);
      if (idx === -1) return;
      root.profiles.splice(idx, 1);
      if (root.activeProfileId === formProfileId) {
        root.activeProfileId = root.profiles[0].id;
      }
      syncActiveProfileRef();
      formProfileId = state.id;
      draftProfName = state.name;
      draftProfPhoto = state.photo || '';
      draftProfFrame = state.frame || 'blue';
      saveState();
      renderProfilesModal();
      render();

    function toggleLock() {
      disarmReset();
      lastActivityMs = Date.now();
      state.locked = !state.locked;
      state.lastText = state.locked ? 'Tela travada pelo cadeado' : 'Tela destravada';
      vibe(12);
      saveState();
      render();
    }

    function getAudioCtx() {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      if (!audioCtx) audioCtx = new AC();
      if (audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});
      return audioCtx;
    }

    function playMissionSound() {
      if (!state.cfg.sound) return;
      try {
        const ctx = getAudioCtx();
        if (!ctx) return;
        const now = ctx.currentTime;
        const seq = [
          { f: 523.25, t: 0.00, d: 0.22 },
          { f: 659.25, t: 0.22, d: 0.22 },
          { f: 783.99, t: 0.44, d: 0.22 },
          { f: 1046.50, t: 0.68, d: 0.52 },
          { f: 783.99, t: 1.25, d: 0.24 },
          { f: 987.77, t: 1.50, d: 0.24 },
          { f: 1046.50, t: 1.76, d: 0.65 },
          { f: 1318.51, t: 2.45, d: 0.35 },
          { f: 1567.98, t: 2.82, d: 0.45 },
          { f: 1046.50, t: 3.30, d: 1.65 }
        ];
        seq.forEach(n => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(n.f, now + n.t);
          gain.gain.setValueAtTime(0.001, now + n.t);
          gain.gain.linearRampToValueAtTime(0.11, now + n.t + 0.03);
          gain.gain.exponentialRampToValueAtTime(0.0008, now + n.t + n.d);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now + n.t);
          osc.stop(now + n.t + n.d + 0.04);
        });
      } catch (_) {}
    }

    function vibe(ms = 12) {
      if (!state.cfg.vibrate) return;
      try { if (navigator.vibrate) navigator.vibrate(ms); } catch (_) {}
    }

    async function syncWakeLock() {
      try {
        if (state.cfg.wakeLock && 'wakeLock' in navigator && document.visibilityState === 'visible') {
          if (!wakeSentinel) wakeSentinel = await navigator.wakeLock.request('screen');
        } else if (wakeSentinel) {
          await wakeSentinel.release();
          wakeSentinel = null;
        }
      } catch (_) {}
    }

    function pickFirstEnabledDailyGoal() {
      const found = state.dailyGoals.find(g => g && g.enabled);
      if (found) {
        state.activeDailyId = found.id;
        state.goal = found.target;
        state.goalName = found.name;
        state.goalMode = 'daily';
        state.goalCompleted = Boolean(found.completed) || state.count >= found.target;
      } else {
        state.activeDailyId = null;
        if (state.goalMode === 'daily') {
          state.goal = null;
          state.goalName = '';
          state.goalCompleted = false;
        }
      }
    }

    function checkDailyRollover() {
      const today = todayKey();
      if (state.goalDay !== today) {
        state.goalDay = today;
        state.goalCompleted = false;
        state.dailyGoals = state.dailyGoals.map(g => ({ ...g, completed: false }));
        if (state.goalMode === 'daily' && state.goal > 0) {
          state.count = 0;
          state.lastText = 'Novo dia: metas diárias renovadas';
        }
      }
    }

    function snapshot() {
      prevSnapshot = { count: state.count, activeLabel: state.activeLabel, goalCompleted: state.goalCompleted };
      const b = document.getElementById('b-undo');
      if (b) b.disabled = false;
    }

    function undoLast() {
      disarmReset();
      if (!prevSnapshot) return;
      state.count = prevSnapshot.count;
      state.activeLabel = prevSnapshot.activeLabel;
      state.goalCompleted = Boolean(prevSnapshot.goalCompleted);
      prevSnapshot = null;
      state.lastText = 'Última alteração desfeita';
      saveState();
      render(true);
    }

    function render(bump = false) {
      checkDailyRollover();
      document.body.classList.toggle('dark', state.dark);
      document.body.classList.toggle('locked', state.locked);
      document.body.classList.toggle('minimal', state.cfg.minimal);
      document.body.classList.toggle('one-hand', Boolean(state.cfg.oneHand));
      document.body.classList.toggle('supervision', isSupervisionOn());
      document.body.setAttribute('data-pal', state.palette || 'blue');

      renderAvatar(document.getElementById('prof-btn'), state);

      const lockBtn = document.getElementById('lock-btn');
      lockBtn.textContent = state.locked ? '🔒' : '🔓';
      lockBtn.classList.toggle('locked', state.locked);

      const m = document.querySelector('meta[name="theme-color"]');
      if (m) m.content = state.dark ? '#090F1E' : '#EEF2FF';

      document.getElementById('pace-pill').textContent = paceLabel;
      document.getElementById('timer-pill').textContent = fmtTime(sessionElapsedSec);

      const numEl = document.getElementById('num');
      numEl.textContent = state.count.toLocaleString('pt-BR');
      if (bump) {
        numEl.classList.remove('bump'); void numEl.offsetWidth; numEl.classList.add('bump');
        setTimeout(() => numEl.classList.remove('bump'), 130);
      }

      document.getElementById('hint').textContent = `Toque na área para +${state.step.toLocaleString('pt-BR')}`;
      document.getElementById('feedback').textContent = state.lastText;

      [1, 5, 10].forEach(n => document.getElementById('step-' + n).classList.toggle('active', n === state.step));
      const customStepBtn = document.getElementById('step-custom');
      const isCustom = ![1, 5, 10].includes(state.step);
      customStepBtn.classList.toggle('active', isCustom);
      customStepBtn.textContent = isCustom ? String(state.step) : '...';

      const chip = document.getElementById('item-chip');
      if (state.activeLabel) {
        chip.textContent = `Continuando: ${state.activeLabel}`;
        chip.classList.add('show');
      } else {
        chip.classList.remove('show');
      }

      const stageEl = document.getElementById('stage');
      const gBox = document.getElementById('goal-box');
      const activeAllowed = state.goal > 0 && (state.goalMode !== 'daily' || !state.activeDailyId || state.dailyGoals.some(g => g.id === state.activeDailyId && g.enabled));
      if (activeAllowed) {
        const pct = Math.min(100, Math.round((state.count / state.goal) * 100));
        const hit = state.count >= state.goal;
        gBox.classList.add('show');
        stageEl.classList.toggle('goal-hit', hit);
        const prefix = state.goalName ? `${state.goalName}: ` : 'Meta: ';
        document.getElementById('goal-label').textContent = `${prefix}${state.count.toLocaleString('pt-BR')} / ${state.goal.toLocaleString('pt-BR')}`;
        document.getElementById('goal-mode-tag').textContent = state.goalMode === 'daily' ? 'DIÁRIA' : '1X';
        document.getElementById('goal-pct').textContent = pct + '%';
        const fill = document.getElementById('goal-fill');
        fill.style.width = pct + '%';
        fill.classList.toggle('done', hit);
      } else {
        gBox.classList.remove('show');
        stageEl.classList.remove('goal-hit');
      }

      document.getElementById('b-m1').disabled = state.count <= 0;
      document.getElementById('b-m10').disabled = state.count <= 0;
      document.getElementById('b-undo').disabled = !prevSnapshot;
      document.getElementById('b-reset').disabled = (state.count === 0 && !state.activeLabel) || isSupervisionOn();
      if (!resetArmed) {
        document.getElementById('b-reset').textContent = state.activeLabel ? 'Cancelar' : 'Zerar';
      }
      document.getElementById('b-finish').disabled = state.count <= 0;
      document.getElementById('hist-badge').textContent = state.history.length;

      document.getElementById('sw-onehand').classList.toggle('on', Boolean(state.cfg.oneHand));
      document.getElementById('sw-hw').classList.toggle('on', Boolean(state.cfg.hwKeys));
      document.getElementById('sw-minimal').classList.toggle('on', Boolean(state.cfg.minimal));
      document.getElementById('sw-sound').classList.toggle('on', Boolean(state.cfg.sound));
      document.getElementById('sw-wake').classList.toggle('on', Boolean(state.cfg.wakeLock));
      document.getElementById('sw-vib').classList.toggle('on', Boolean(state.cfg.vibrate));
      document.querySelectorAll('.pal-dot[data-p]').forEach(dot => {
        dot.classList.toggle('active', dot.getAttribute('data-p') === (state.palette || 'blue'));
      });
    }

    function handleGoalHit(prevCount) {
      if (!state.goal || state.goal <= 0) return;
      if (state.goalMode === 'daily' && state.activeDailyId) {
        const dg = state.dailyGoals.find(g => g.id === state.activeDailyId);
        if (!dg || !dg.enabled) return;
      }
      if (prevCount < state.goal && state.count >= state.goal && !state.goalCompleted) {
        state.goalCompleted = true;
        if (state.goalMode === 'daily' && state.activeDailyId) {
          const dg = state.dailyGoals.find(g => g.id === state.activeDailyId);
          if (dg) dg.completed = true;
        }
        vibe(45);
        playMissionSound();
        const titleTxt = state.goalName ? `"${state.goalName}"` : `Meta de ${state.goal.toLocaleString('pt-BR')}`;
        if (state.goalMode === 'once') {
          state.lastText = `${titleTxt} atingida (uso único concluído)`;
          state.goal = null;
          state.goalName = '';
          state.goalCompleted = false;
        } else {
          state.lastText = `Meta diária ${titleTxt} atingida!`;
        }
      }
    }

    function applyMaxCountCap(rawNext) {
      const cap = Number(root.admin && root.admin.maxCount) || 0;
      if (cap > 0 && rawNext > cap) return { val: cap, capped: true };
      return { val: rawNext, capped: false };
    }

    function add(delta, tag = '') {
      if (!root.onboardingDone || showPickerOnOpen || state.locked) return;
      disarmReset();
      checkDailyRollover();
      getAudioCtx();
      const prev = state.count;
      const { val: next, capped } = applyMaxCountCap(Math.max(0, prev + delta));
      if (next !== prev) snapshot();
      state.count = next;
      const diff = state.count - prev;
      if (diff > 0) {
        updateSessionAndPace(true);
        state.lastText = (tag ? tag + ' ' : '') + `+${diff.toLocaleString('pt-BR')} · Total ${state.count.toLocaleString('pt-BR')}${capped ? ' (teto ADM)' : ''}`;
        handleGoalHit(prev);
      } else if (diff < 0) {
        updateSessionAndPace(false);
        state.lastText = (tag ? tag + ' ' : '') + `${diff.toLocaleString('pt-BR')} · Total ${state.count.toLocaleString('pt-BR')}`;
      } else if (delta > 0 && capped) {
        state.lastText = `Teto máximo ADM atingido (${state.count.toLocaleString('pt-BR')})`;
      } else if (delta < 0) {
        state.lastText = 'Já está em 0';
      }
      saveState();
      render(true);
    }

    function onStageClick(e) {
      if (!root.onboardingDone || showPickerOnOpen || state.locked) return;
      disarmReset();
      getAudioCtx();
      const rect = e.currentTarget.getBoundingClientRect();
      const r = document.createElement('span');
      r.className = 'ripple';
      r.style.left = (e.clientX - rect.left) + 'px';
      r.style.top = (e.clientY - rect.top) + 'px';
      e.currentTarget.appendChild(r);
      setTimeout(() => r.remove(), 460);
      vibe(12);
      const prev = state.count;
      const { val: next, capped } = applyMaxCountCap(prev + state.step);
      if (next !== prev) snapshot();
      state.count = next;
      const diff = state.count - prev;
      if (diff > 0) {
        updateSessionAndPace(true);
        state.lastText = `+${diff.toLocaleString('pt-BR')} · Total ${state.count.toLocaleString('pt-BR')}${capped ? ' (teto ADM)' : ''}`;
        handleGoalHit(prev);
      } else if (capped) {
        state.lastText = `Teto máximo ADM atingido (${state.count.toLocaleString('pt-BR')})`;
      }
      saveState();
      render(true);
    }

    let lastHwTriggerMs = 0;
    function handleHardwareTrigger(direction) {
      if (!root.onboardingDone || showPickerOnOpen || !state.cfg.hwKeys || state.locked) return;
      if (document.querySelector('.modal.open')) return;
      const activeTag = (document.activeElement && document.activeElement.tagName) || '';
      if (/INPUT|TEXTAREA|SELECT/.test(activeTag)) return;
      const now = Date.now();
      if (now - lastHwTriggerMs < 90) return;
      lastHwTriggerMs = now;
      vibe(12);
      if (direction === 'up') add(state.step, 'Botão físico');
      else if (direction === 'down') add(-state.step, 'Botão físico');
    }

    function inspectKeyEvent(e, isKeyUp = false) {
      if (!root.onboardingDone || showPickerOnOpen || !state.cfg.hwKeys || state.locked) return;
      if (document.querySelector('.modal.open')) return;
      const activeTag = (document.activeElement && document.activeElement.tagName) || '';
      if (/INPUT|TEXTAREA|SELECT/.test(activeTag)) return;
      const k = String(e.key || '');
      const code = String(e.code || '');
      const kc = Number(e.keyCode || e.which || 0);

      const isUp =
        k === 'AudioVolumeUp' || k === 'VolumeUp' || code === 'VolumeUp' ||
        k === 'ArrowUp' || k === ' ' || code === 'Space' ||
        k === 'MediaTrackNext' || code === 'MediaTrackNext' || kc === 24 || kc === 38 || kc === 32;

      const isDown =
        k === 'AudioVolumeDown' || k === 'VolumeDown' || code === 'VolumeDown' ||
        k === 'ArrowDown' || k === 'MediaTrackPrevious' || code === 'MediaTrackPrevious' || kc === 25 || kc === 40;

      if (isUp) {
        e.preventDefault();
        if (!isKeyUp) handleHardwareTrigger('up');
      } else if (isDown) {
        e.preventDefault();
        if (!isKeyUp) handleHardwareTrigger('down');
      }
    }

    window.addEventListener('keydown', (e) => inspectKeyEvent(e, false), { passive: false });
    window.addEventListener('keyup', (e) => inspectKeyEvent(e, true), { passive: false });
    document.addEventListener('volumeupbutton', () => handleHardwareTrigger('up'), false);
    document.addEventListener('volumedownbutton', () => handleHardwareTrigger('down'), false);

    function setStep(n) {
      disarmReset();
      const val = Math.floor(Number(n));
      if (!Number.isFinite(val) || val <= 0) return;
      state.step = val;
      state.lastText = `Passo alterado para ${val.toLocaleString('pt-BR')}`;
      saveState();
      render();
    }

    function openStepModal() {
      disarmReset();
      document.getElementById('inp-step').value = ![1, 5, 10].includes(state.step) ? state.step : '';
      openModal('m-step');
    }
    function pickStep(n) { closeModal('m-step'); setStep(n); }
    function saveStep() {
      const v = parseInt(document.getElementById('inp-step').value, 10);
      closeModal('m-step');
      if (!isNaN(v) && v > 0) setStep(v);
    }

    function toggleTheme() {
      disarmReset();
      state.dark = !state.dark;
      state.lastText = state.dark ? 'Tema escuro ativo' : 'Tema claro ativo';
      saveState();
      render();
    }

    function setPalette(pal) {
      if (isSupervisionOn()) {
        state.lastText = 'Bloqueado pelo Modo Supervisão';
        render();
        return;
      }
      state.palette = pal;
      saveState();
      render();
    }

    function resetCounter() {
      if (state.locked) return;
      if (isSupervisionOn()) {
        state.lastText = 'Bloqueado pelo Modo Supervisão';
        render();
        return;
      }
      if (state.activeLabel) {
        disarmReset();
        snapshot();
        state.activeLabel = null;
        state.count = 0;
        sessionStartMs = null;
        sessionElapsedSec = 0;
        tapIntervals = [];
        lastTapMs = null;
        paceLabel = 'Ritmo: --';
        state.lastText = 'Continuação cancelada';
        saveState();
        render(true);
        return;
      }
      if (state.count <= 0) { disarmReset(); return; }

      const btn = document.getElementById('b-reset');
      if (!resetArmed) {
        resetArmed = true;
        if (btn) btn.textContent = 'Certeza?';
        armResetTimer = setTimeout(() => { disarmReset(); }, 3500);
        return;
      }

      disarmReset();
      snapshot();
      state.count = 0;
      sessionStartMs = null;
      sessionElapsedSec = 0;
      tapIntervals = [];
      lastTapMs = null;
      paceLabel = 'Ritmo: --';
      state.lastText = 'Contador zerado';
      saveState();
      render(true);
    }

    function openConfig() {
      disarmReset();
      resetSecretPanel();
      render();
      openModal('m-cfg');
    }

    function toggleCfg(key) {
      if (isSupervisionOn()) {
        state.lastText = 'Configurações bloqueadas pelo Modo Supervisão';
        render();
        return;
      }
      getAudioCtx();
      state.cfg[key] = !state.cfg[key];
      if (key === 'sound' && state.cfg.sound) playMissionSound();
      if (key === 'vibrate' && state.cfg.vibrate) vibe(15);
      if (key === 'oneHand') {
        state.lastText = state.cfg.oneHand ? 'Modo mão única ativado' : 'Modo mão única desativado';
      }
      if (key === 'hwKeys') {
        state.lastText = state.cfg.hwKeys
          ? 'Botões físicos ativados (quando o aparelho repassar)'
          : 'Botões físicos desativados';
      }
      saveState();
      syncWakeLock();
      render();
    }

    function openModal(id) {
      resetConfirmations();
      document.getElementById(id).classList.add('open');
    }
    function closeModal(id) {
      resetConfirmations();
      if (id === 'm-cfg') resetSecretPanel();
      document.getElementById(id).classList.remove('open');
    }

    function syncValModeButtons() {
      document.getElementById('val-mode-add').classList.toggle('active', draftValMode === 'add');
      document.getElementById('val-mode-sub').classList.toggle('active', draftValMode === 'sub');
      document.getElementById('btn-apply-val').textContent = draftValMode === 'sub' ? 'Tirar do Total' : 'Colocar no Total';
    }
    function selectValMode(m) {
      draftValMode = m === 'sub' ? 'sub' : 'add';
      syncValModeButtons();
    }
    function openCustom() {
      if (state.locked) return;
      disarmReset();
      draftValMode = 'add';
      syncValModeButtons();
      document.getElementById('inp-custom').value = '';
      openModal('m-custom');

    function quickVal(v) {
      closeModal('m-custom');
      add(draftValMode === 'sub' ? -Math.abs(v) : Math.abs(v), 'Manual');

    function confirmCustom() {
      const v = Math.abs(parseInt(document.getElementById('inp-custom').value, 10));
      closeModal('m-custom');
      if (!isNaN(v) && v > 0) add(draftValMode === 'sub' ? -v : v, 'Manual');
