    function syncGoalModeButtons() {
      document.getElementById('mode-once').classList.toggle('active', draftGoalMode === 'once');
      document.getElementById('mode-daily').classList.toggle('active', draftGoalMode === 'daily');
    }
    function selectGoalMode(mode) {
      draftGoalMode = mode === 'daily' ? 'daily' : 'once';
      syncGoalModeButtons();
    }
    function cancelEditGoal() {
      editingDailyIdx = null;
      armedGoalDelIdx = null;
      document.getElementById('goal-modal-title').textContent = '🎯 Meta de Contagem';
      document.getElementById('btn-save-goal').textContent = 'Salvar';
      document.getElementById('inp-goal-name').value = '';
      document.getElementById('inp-goal').value = '';
      renderDailyGoalsList();
    }

    function renderDailyGoalsList() {
      document.getElementById('daily-goals-count').textContent = state.dailyGoals.length;
      const box = document.getElementById('daily-goals-list');
      if (!state.dailyGoals.length) {
        box.innerHTML = '<p style="text-align:center;color:var(--muted);padding:12px 0;font-size:0.78rem;">Nenhuma meta diária salva ainda.</p>';
        return;
      }
      box.innerHTML = state.dailyGoals.map((dg, idx) => {
        const isFocus = state.goalMode === 'daily' && state.activeDailyId === dg.id && dg.enabled;
        const isDone = Boolean(dg.completed) || (isFocus && state.count >= dg.target);
        const delLabel = armedGoalDelIdx === idx ? 'Certeza?' : 'Excluir';
        return `
          <div class="dgoal-card ${isFocus ? 'focus' : ''} ${isDone ? 'done' : ''} ${!dg.enabled ? 'off' : ''}">
            <div class="dgoal-top">
              <div style="min-width:0;flex:1;">
                <div class="dgoal-name">${dg.name}</div>
                <div style="font-size:0.68rem;color:var(--muted);margin-top:2px;">
                  ${isDone ? 'Concluída hoje' : (dg.enabled ? (isFocus ? 'Ativa na contagem' : 'Ligada') : 'Desligada')}
                </div>
              </div>
              <div class="dgoal-target">${Number(dg.target).toLocaleString('pt-BR')}</div>
            </div>
            <div class="dgoal-foot">
              <div style="display:flex;gap:4px;">
                <button class="s-btn" type="button" onclick="moveDailyGoal(${idx}, -1)" ${idx === 0 ? 'disabled' : ''}>↑</button>
                <button class="s-btn" type="button" onclick="moveDailyGoal(${idx}, 1)" ${idx === state.dailyGoals.length - 1 ? 'disabled' : ''}>↓</button>
              </div>
              <div class="h-btns">
                <button class="s-btn" type="button" onclick="useDailyGoal(${idx})">Usar</button>
                <button class="s-btn" type="button" onclick="editDailyGoal(${idx})">Editar</button>
                <button class="s-btn" type="button" onclick="toggleDailyGoalDone(${idx})">${isDone ? 'Reabrir' : 'Concluir'}</button>
                <button class="s-btn" type="button" onclick="toggleDailyGoalEnabled(${idx})">${dg.enabled ? 'Desligar' : 'Ligar'}</button>
                <button class="s-btn b-danger" type="button" onclick="delDailyGoal(${idx})">${delLabel}</button>
              </div>
            </div>
          </div>`;
      }).join('');
    }

    function openGoal() {
      disarmReset();
      editingDailyIdx = null;
      armedGoalDelIdx = null;
      document.getElementById('goal-modal-title').textContent = '🎯 Meta de Contagem';
      document.getElementById('btn-save-goal').textContent = 'Salvar';
      document.getElementById('inp-goal-name').value = state.goalName || '';
      document.getElementById('inp-goal').value = state.goal || '';
      draftGoalMode = state.goalMode || 'once';
      syncGoalModeButtons();
      renderDailyGoalsList();
      openModal('m-goal');
    }

    function clearAllDailyGoals() {
      if (isSupervisionOn()) {
        state.lastText = 'Bloqueado pelo Modo Supervisão';
        render();
        return;
      }
      if (!state.dailyGoals.length) return;
      const btn = document.getElementById('btn-clear-goals');
      if (!armClearGoals) {
        resetConfirmations();
        armClearGoals = true;
        if (btn) btn.textContent = 'Certeza?';
        clearGoalsTimer = setTimeout(() => {
          armClearGoals = false;
          if (btn) btn.textContent = 'Limpar metas';
        }, 3500);
        return;
      }
      resetConfirmations();
      state.dailyGoals = [];
      state.activeDailyId = null;
      if (state.goalMode === 'daily') {
        state.goal = null;
        state.goalName = '';
        state.goalCompleted = false;
      }
      state.lastText = 'Metas diárias limpas';
      saveState();
      renderDailyGoalsList();
      render();
    }

    function editDailyGoal(idx) {
      const dg = state.dailyGoals[idx];
      if (!dg) return;
      armedGoalDelIdx = null;
      editingDailyIdx = idx;
      draftGoalMode = 'daily';
      syncGoalModeButtons();
      document.getElementById('goal-modal-title').textContent = '🎯 Editar Meta Diária';
      document.getElementById('btn-save-goal').textContent = 'Atualizar';
      document.getElementById('inp-goal-name').value = dg.name;
      document.getElementById('inp-goal').value = dg.target;
    }

    function toggleDailyGoalDone(idx) {
      const dg = state.dailyGoals[idx];
      if (!dg) return;
      dg.completed = !dg.completed;
      if (state.activeDailyId === dg.id) {
        state.goalCompleted = dg.completed;
        if (dg.completed && state.count < dg.target) state.count = dg.target;
      }
      state.lastText = dg.completed ? `Meta "${dg.name}" marcada como concluída` : `Meta "${dg.name}" reaberta`;
      saveState();
      renderDailyGoalsList();
      render(true);
    }

    function clearGoal() {
      state.goal = null;
      state.goalName = '';
      state.activeDailyId = null;
      state.goalCompleted = false;
      state.lastText = 'Meta removida';
      cancelEditGoal();
      closeModal('m-goal');
      saveState();
      render();
    }

    function saveGoal() {
      const v = parseInt(document.getElementById('inp-goal').value, 10);
      const name = (document.getElementById('inp-goal-name').value || '').trim();

      if (editingDailyIdx !== null && state.dailyGoals[editingDailyIdx]) {
        const dg = state.dailyGoals[editingDailyIdx];
        if (!isNaN(v) && v > 0) {
          dg.name = name || dg.name;
          dg.target = v;
          dg.completed = state.count >= v;
          if (state.activeDailyId === dg.id) {
            state.goal = v;
            state.goalName = dg.name;
            state.goalCompleted = dg.completed;
          }
          state.lastText = `Meta "${dg.name}" atualizada`;
        }
        cancelEditGoal();
        saveState();
        render();
        return;
      }

      if (!isNaN(v) && v > 0) {
        state.goal = v;
        state.goalName = name || (draftGoalMode === 'daily' ? 'Meta diária' : 'Meta');
        state.goalMode = draftGoalMode;
        state.goalDay = todayKey();
        state.goalCompleted = state.count >= v;

        if (draftGoalMode === 'daily') {
          const newItem = {
            id: Date.now() + Math.random(),
            name: state.goalName,
            target: v,
            enabled: true,
            completed: state.count >= v
          };
          state.dailyGoals.push(newItem);
          state.activeDailyId = newItem.id;
          state.lastText = `Meta diária salva: "${state.goalName}" (${v.toLocaleString('pt-BR')})`;
        } else {
          state.activeDailyId = null;
          state.lastText = `Meta única salva: "${state.goalName}" (${v.toLocaleString('pt-BR')})`;
        }
      } else {
        state.goal = null;
        state.goalName = '';
        state.activeDailyId = null;
        state.goalCompleted = false;
        state.lastText = 'Meta removida';
      }
      cancelEditGoal();
      closeModal('m-goal');
      saveState();
      render();
    }

    function useDailyGoal(idx) {
      const dg = state.dailyGoals[idx];
      if (!dg) return;
      armedGoalDelIdx = null;
      dg.enabled = true;
      state.goalMode = 'daily';
      state.activeDailyId = dg.id;
      state.goal = dg.target;
      state.goalName = dg.name;
      state.goalDay = todayKey();
      state.goalCompleted = Boolean(dg.completed) || state.count >= dg.target;
      state.lastText = `Meta diária ativa: "${dg.name}"`;
      saveState();
      renderDailyGoalsList();
      render();
    }

    function toggleDailyGoalEnabled(idx) {
      const dg = state.dailyGoals[idx];
      if (!dg) return;
      armedGoalDelIdx = null;
      dg.enabled = !dg.enabled;
      if (!dg.enabled && state.activeDailyId === dg.id) pickFirstEnabledDailyGoal();
      else if (dg.enabled && state.goalMode === 'daily' && !state.activeDailyId) pickFirstEnabledDailyGoal();
      saveState();
      renderDailyGoalsList();
      render();
    }

    function moveDailyGoal(idx, dir) {
      const targetIdx = idx + dir;
      if (targetIdx < 0 || targetIdx >= state.dailyGoals.length) return;
      armedGoalDelIdx = null;
      const temp = state.dailyGoals[idx];
      state.dailyGoals[idx] = state.dailyGoals[targetIdx];
      state.dailyGoals[targetIdx] = temp;
      saveState();
      renderDailyGoalsList();
    }

    function delDailyGoal(idx) {
      if (isSupervisionOn()) {
        state.lastText = 'Bloqueado pelo Modo Supervisão';
        render();
        return;
      }
      const dg = state.dailyGoals[idx];
      if (!dg) return;
      if (armedGoalDelIdx !== idx) {
        resetConfirmations();
        armedGoalDelIdx = idx;
        renderDailyGoalsList();
        goalDelTimer = setTimeout(() => {
          armedGoalDelIdx = null;
          renderDailyGoalsList();
        }, 3500);
        return;
      }
      resetConfirmations();
      const wasActive = state.activeDailyId === dg.id;
      state.dailyGoals.splice(idx, 1);
      if (wasActive) pickFirstEnabledDailyGoal();
      state.lastText = `Meta "${dg.name}" excluída`;
      saveState();
      renderDailyGoalsList();
      render();
    }

    function openFinish() {
      if (state.locked) return;
      disarmReset();
      if (state.count <= 0) return;
      editingHistIdx = null;
      document.getElementById('fin-modal-title').textContent = '✅ Concluir Contagem';
      document.getElementById('fin-val-box').style.display = 'flex';
      document.getElementById('inp-edit-hist-val').style.display = 'none';
      document.getElementById('btn-save-finish').textContent = 'Salvar e Zerar';
      document.getElementById('fin-val').textContent = state.count.toLocaleString('pt-BR');
      document.getElementById('inp-label').value = state.activeLabel || '';
      openModal('m-finish');
    }

    function editHistItem(idx) {
      const item = state.history[idx];
      if (!item) return;
      armedHistDelIdx = null;
      editingHistIdx = idx;
      document.getElementById('fin-modal-title').textContent = '✏️ Editar Registro';
      document.getElementById('fin-val-box').style.display = 'none';
      document.getElementById('inp-edit-hist-val').style.display = 'block';
      document.getElementById('btn-save-finish').textContent = 'Salvar Edição';
      document.getElementById('inp-label').value = item.label || '';
      document.getElementById('inp-edit-hist-val').value = Number(item.value) || 0;
      openModal('m-finish');
    }

    function saveFinish() {
      getAudioCtx();
      const label = (document.getElementById('inp-label').value || '').trim() || 'Contagem';

      if (editingHistIdx !== null && state.history[editingHistIdx]) {
        const val = Math.max(0, parseInt(document.getElementById('inp-edit-hist-val').value, 10) || 0);
        state.history[editingHistIdx].label = label;
        state.history[editingHistIdx].value = val;
        editingHistIdx = null;
        state.lastText = `Registro "${label}" atualizado`;
        closeModal('m-finish');
        saveState();
        renderHistoryList();
        render();
        return;
      }

      if (state.count <= 0) return closeModal('m-finish');
      const val = state.count;
      const elapsedTxt = sessionElapsedSec > 0 ? ` · ${fmtTime(sessionElapsedSec)}` : '';
      const now = new Date();
      state.history.unshift({
        id: Date.now() + Math.random(),
        label,
        value: val,
        dayKey: todayKey(),
        date: now.toLocaleString('pt-BR') + elapsedTxt
      });
      state.count = 0;
      state.activeLabel = null;
      prevSnapshot = null;
      sessionStartMs = null;
      sessionElapsedSec = 0;
      tapIntervals = [];
      lastTapMs = null;
      paceLabel = 'Ritmo: --';
      if (state.goalMode === 'daily' && state.goal > 0) {
        state.goalDay = todayKey();
        state.goalCompleted = false;
      }
      state.lastText = `Salvo: "${label}" (${val.toLocaleString('pt-BR')})`;
      playMissionSound();
      closeModal('m-finish');
      saveState();
      render(true);
    }

    function isTodayRecord(item) {
      if (!item) return false;
      if (item.dayKey) return item.dayKey === todayKey();
      const todayPt = new Date().toLocaleDateString('pt-BR');
      return String(item.date || '').startsWith(todayPt);
    }

    function toggleTodayFilter() {
      armedHistDelIdx = null;
      onlyToday = !onlyToday;
      document.getElementById('btn-filter-today').classList.toggle('on', onlyToday);
      renderHistoryList();
    }

    function getFilteredHistory() {
      const q = (document.getElementById('inp-search').value || '').trim().toLowerCase();
      return state.history
        .map((item, idx) => ({ item, idx }))
        .filter(({ item }) => {
          const matchText = !q || String(item.label || '').toLowerCase().includes(q);
          const matchDay = !onlyToday || isTodayRecord(item);
          return matchText && matchDay;
        });
    }

    function renderHistoryList() {
      const filtered = getFilteredHistory();
      const total = filtered.reduce((a, b) => a + (Number(b.item.value) || 0), 0);
      const scope = onlyToday ? 'hoje' : 'salvos';
      document.getElementById('hist-sub').textContent = `${filtered.length} ${filtered.length === 1 ? 'registro' : 'registros'} ${scope} · Soma: ${total.toLocaleString('pt-BR')}`;

      const bh = document.getElementById('btn-clear-hist');
      if (bh) bh.disabled = isSupervisionOn();

      const list = document.getElementById('hist-list');
      list.innerHTML = !filtered.length
        ? '<p style="text-align:center;color:var(--muted);padding:20px 0;font-size:0.86rem;">Nenhuma contagem encontrada.</p>'
        : filtered.map(({ item, idx }) => {
          const delLabel = armedHistDelIdx === idx ? 'Certeza?' : 'Excluir';
          return `
          <div class="h-item">
            <div class="h-top">
              <div style="min-width:0;flex:1;">
                <strong style="font-size:0.88rem;word-break:break-word;">${item.label}</strong>
                <div style="font-size:0.7rem;color:var(--muted);margin-top:2px;">${item.date || ''}</div>
              </div>
              <div class="h-val">${Number(item.value || 0).toLocaleString('pt-BR')}</div>
            </div>
            <div class="h-btns">
              <button class="s-btn" style="color:var(--accent)" onclick="contHist(${idx})">Continuar</button>
              <button class="s-btn" onclick="sumHist(${idx})">Somar</button>
              <button class="s-btn" onclick="editHistItem(${idx})">Editar</button>
              <button class="s-btn" onclick="dupHist(${idx})">Duplicar</button>
              <button class="s-btn b-danger" onclick="delHist(${idx})" ${isSupervisionOn() ? 'disabled' : ''}>${delLabel}</button>
            </div>
          </div>`;
        }).join('');
    }

    function openHistory() {
      disarmReset();
      onlyToday = false;
      armedHistDelIdx = null;
      document.getElementById('btn-filter-today').classList.remove('on');
      document.getElementById('inp-search').value = '';
      const pb = document.getElementById('pdf-preview-box');
      if (pb) pb.style.display = 'none';
      renderHistoryList();
      openModal('m-hist');
    }

    function contHist(i) {
      const x = state.history[i];
      if (!x) return;
      armedHistDelIdx = null;
      state.history.splice(i, 1);
      state.count = Math.max(0, Number(x.value) || 0);
      state.activeLabel = x.label || 'Contagem';
      state.lastText = `Continuando "${state.activeLabel}"`;
      closeModal('m-hist'); saveState(); render(true);
    }
    function sumHist(i) {
      const x = state.history[i];
      if (!x) return;
      armedHistDelIdx = null;
      closeModal('m-hist');
      add(Math.max(0, Number(x.value) || 0), `Histórico "${x.label || 'Contagem'}"`);
    }
    function dupHist(i) {
      const x = state.history[i];
      if (!x) return;
      armedHistDelIdx = null;
      const now = new Date();
      state.history.unshift({
        id: Date.now() + Math.random(),
        label: x.label || 'Contagem',
        value: Math.max(0, Number(x.value) || 0),
        dayKey: todayKey(),
        date: now.toLocaleString('pt-BR')
      });
      state.lastText = `Duplicado: "${x.label || 'Contagem'}"`;
      saveState(); renderHistoryList(); render();
    }
    function delHist(i) {
      if (isSupervisionOn()) {
        state.lastText = 'Exclusão bloqueada pelo Modo Supervisão';
        render();
        return;
      }
      if (i < 0 || i >= state.history.length) return;
      if (armedHistDelIdx !== i) {
        resetConfirmations();
        armedHistDelIdx = i;
        renderHistoryList();
        histDelTimer = setTimeout(() => {
          armedHistDelIdx = null;
          renderHistoryList();
        }, 3500);
        return;
      }
      resetConfirmations();
      state.history.splice(i, 1);
      state.lastText = 'Item removido do histórico';
      saveState(); renderHistoryList(); render();
    }

    function clearHistory() {
      if (isSupervisionOn()) {
        state.lastText = 'Exclusão bloqueada pelo Modo Supervisão';
        render();
        return;
      }
      if (!state.history.length) return;
      const btn = document.getElementById('btn-clear-hist');
      if (!armClearHist) {
        resetConfirmations();
        armClearHist = true;
        if (btn) btn.textContent = 'Certeza?';
        clearHistTimer = setTimeout(() => {
          armClearHist = false;
          if (btn) btn.textContent = 'Limpar tudo';
        }, 3500);
        return;
      }
      resetConfirmations();
      state.history = [];
      state.lastText = 'Histórico limpo';
      saveState(); renderHistoryList(); render();
    }

    function copySummary() {
      const rows = getFilteredHistory().map(x => x.item);
      if (!rows.length) {
        state.lastText = 'Sem registros para copiar';
        render();
        return;
      }
      const total = rows.reduce((a, b) => a + (Number(b.value) || 0), 0);
      const lines = [
        `Resumo (${state.name})`,
        ...rows.map(x => `- ${x.label}: ${Number(x.value || 0).toLocaleString('pt-BR')}${x.date ? ' (' + x.date + ')' : ''}`),
        `Total geral: ${total.toLocaleString('pt-BR')}`
      ].join('\n');
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(lines).catch(() => {});
      }
      state.lastText = 'Resumo copiado';
      render();
    }

    function exportCsv() {
      const rows = getFilteredHistory().map(x => x.item);
      if (!rows.length) { state.lastText = 'Nada para exportar em CSV'; render(); return; }
      const esc = v => '"' + String(v ?? '').replace(/"/g, '""') + '"';
      const lines = ['Nome;Valor;Data'].concat(rows.map(r => [esc(r.label), Number(r.value) || 0, esc(r.date || '')].join(';')));
      const csvText = '\uFEFF' + lines.join('\r\n');
      try {
        const blob = new Blob([csvText], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'contagens.csv';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(() => URL.revokeObjectURL(url), 1000);
      } catch (_) {}
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(lines.join('\n')).catch(() => {});
      }
      state.lastText = 'CSV gerado (e copiado para planilha)';
      render();
    }

    function exportPdfView() {
      const rows = getFilteredHistory().map(x => x.item);
      const total = rows.reduce((a, b) => a + (Number(b.value) || 0), 0);
      const box = document.getElementById('pdf-preview-box');
      if (!box) return;
      if (!rows.length) {
        box.innerHTML = '<div style="font-size:0.82rem;">Nenhum registro para gerar relatório.</div>';
        box.style.display = 'block';
        return;
      }
      const htmlRows = rows.map(r => `<tr><td style="padding:6px;border-bottom:1px solid #E2E8F0;font-size:0.78rem">${r.label}</td><td style="padding:6px;border-bottom:1px solid #E2E8F0;text-align:right;font-size:0.78rem;font-weight:700">${Number(r.value || 0).toLocaleString('pt-BR')}</td><td style="padding:6px;border-bottom:1px solid #E2E8F0;font-size:0.72rem;color:#475569">${r.date || ''}</td></tr>`).join('');
      box.innerHTML = `
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
          <strong style="font-size:0.86rem;">Relatório — ${state.name}</strong>
          <button type="button" onclick="document.getElementById('pdf-preview-box').style.display='none'" style="border:1px solid #CBD5E1;background:#F1F5F9;color:#0F172A;border-radius:8px;padding:3px 8px;font-size:0.72rem;font-weight:700;">Fechar</button>
        </div>
        <table style="width:100%;border-collapse:collapse">
          <thead><tr><th style="text-align:left;padding:6px;border-bottom:2px solid #0F172A;font-size:0.76rem">Item</th><th style="text-align:right;padding:6px;border-bottom:2px solid #0F172A;font-size:0.76rem">Valor</th><th style="text-align:left;padding:6px;border-bottom:2px solid #0F172A;font-size:0.76rem">Data</th></tr></thead>
          <tbody>${htmlRows}</tbody>
        </table>
        <div style="display:flex;justify-content:space-between;align-items:center;margin-top:10px;">
          <strong style="font-size:0.84rem;">Total: ${total.toLocaleString('pt-BR')}</strong>
          <button type="button" onclick="window.print()" style="border:none;background:#2563EB;color:#FFF;border-radius:9px;padding:6px 10px;font-size:0.74rem;font-weight:700;">Imprimir / Salvar PDF</button>
        </div>`;
      box.style.display = 'block';
    }

    function exportJson() {
      const blob = new Blob([JSON.stringify(root, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'contador-backup.json';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }

    function importJson(e) {
      const f = e.target.files && e.target.files[0]; if (!f) return;
      const r = new FileReader();
      r.onload = () => {
        try {
          const d = JSON.parse(r.result);
          const maxP = getMaxProfiles();
          if (d && Array.isArray(d.profiles) && d.profiles.length) {
            root.onboardingDone = true;
            showPickerOnOpen = false;
            root.profiles = d.profiles.slice(0, maxP);
            root.activeProfileId = d.activeProfileId || root.profiles[0].id;
            syncActiveProfileRef();
          } else if (d && typeof d === 'object') {
            Object.assign(state, d);
            root.onboardingDone = true;
            showPickerOnOpen = false;
          }
          state.lastText = 'Backup importado';
          saveState(); syncScreens(); renderHistoryList(); renderDailyGoalsList(); syncWakeLock(); render();
        } catch (_) { alert('JSON inválido.'); }
      };
      r.readAsText(f);
    }

    let rec = null, voiceOn = false, lastSpoken = '', lastSpokenAt = 0;
    const words = {
      'zero':0,'um':1,'uma':1,'one':1,'dois':2,'duas':2,'two':2,'tres':3,'três':3,'three':3,
      'quatro':4,'four':4,'cinco':5,'five':5,'seis':6,'meia':6,'six':6,'sete':7,'seven':7,
      'oito':8,'eight':8,'nove':9,'nine':9,'dez':10,'ten':10,'onze':11,'doze':12,'treze':13,
      'quatorze':14,'quinze':15,'fifteen':15,'dezesseis':16,'dezessete':17,'dezoito':18,'dezenove':19,
      'vinte':20,'twenty':20,'trinta':30,'thirty':30,'quarenta':40,'cinquenta':50,'fifty':50,
      'sessenta':60,'setenta':70,'oitenta':80,'noventa':90,'cem':100,'cento':100,'hundred':100,'mil':1000
    };

    function setMicColor(on) {
      const btn = document.getElementById('voice-btn');
      if (btn) btn.classList.toggle('on', Boolean(on));
    }

    function parseSpeech(raw) {
      if (!root.onboardingDone || showPickerOnOpen || state.locked) return;
      const clean = String(raw || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').trim();
      if (!clean) return;
      const now = Date.now();
      if (clean === lastSpoken && now - lastSpokenAt < 900) return;
      lastSpoken = clean;
      lastSpokenAt = now;

      if (/(^|\s)(zerar|zera)(\s|$)/.test(clean) && state.count > 0) {
        if (isSupervisionOn()) {
          state.lastText = 'Bloqueado pelo Modo Supervisão';
          render();
          return;
        }
        snapshot(); state.count = 0; state.lastText = 'Voz: zerado'; saveState(); render(true); return;
      }
      if (/(^|\s)(desfazer|volta|voltar)(\s|$)/.test(clean) && prevSnapshot) {
        undoLast(); return;
      }
      if (/(^|\s)(concluir|salvar)(\s|$)/.test(clean) && state.count > 0) {
        openFinish(); return;
      }

      const sub = /(^|\s)(tira|tirar|tirou|menos|subtrai|subtrair|remove|remover|deduz)(\s|$)/.test(clean);
      const tokens = clean.replace(/[^a-z0-9\s+-]/g, ' ').split(/\s+/);
      const nums = [];
      for (const t of tokens) {
        if (/^[+-]?\d+$/.test(t)) nums.push(Math.abs(parseInt(t, 10)));
        else if (words[t] !== undefined && words[t] > 0) nums.push(words[t]);
      }
      if (!nums.length) {
        add(sub ? -state.step : state.step, 'Voz');
        return;
      }
      const val = sub ? nums[nums.length - 1] : nums.reduce((a, b) => a + b, 0);
      add(sub ? -val : val, 'Voz');
    }

    function makeRecognizer() {
      const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SR) return null;
      const r = new SR();
      r.lang = 'pt-BR';
      r.continuous = true;
      r.interimResults = false;
      r.onstart = () => setMicColor(true);
      r.onresult = (e) => {
        for (let i = e.resultIndex; i < e.results.length; i++) {
          if (e.results[i].isFinal && e.results[i][0]) {
            parseSpeech(e.results[i][0].transcript);
          }
        }
      };
      r.onerror = (e) => {
        if (e && (e.error === 'not-allowed' || e.error === 'service-not-allowed')) {
          voiceOn = false;
          setMicColor(false);
          state.lastText = 'Permissão de microfone negada';
          render();
        }
      };
      r.onend = () => {
        if (voiceOn) {
          setTimeout(() => {
            if (!voiceOn) return;
            try { rec = makeRecognizer(); if (rec) rec.start(); } catch (_) {}
          }, 180);
        } else {
          setMicColor(false);
        }
      };
      return r;
    }

    function toggleVoice() {
      if (state.locked) return;
      disarmReset();
      const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SR) {
        setMicColor(false);
        state.lastText = 'Voz indisponível neste navegador';
        render();
        return;
      }
      voiceOn = !voiceOn;
      if (!voiceOn) {
        try { if (rec) { rec.onend = null; rec.stop(); } } catch (_) {}
        rec = null;
        setMicColor(false);
        return;
      }
      setMicColor(true);
      try {
        rec = makeRecognizer();
        if (rec) rec.start();
      } catch (_) {
        voiceOn = false;
        setMicColor(false);
      }
    }

    if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
      const sw = `const C='cnt-perfis-v16';self.addEventListener('install',e=>{e.waitUntil(caches.open(C).then(c=>c.addAll(['./'])));self.skipWaiting();});self.addEventListener('fetch',e=>{e.respondWith(caches.match(e.request).then(r=>r||fetch(e.request).then(res=>{caches.open(C).then(c=>c.put(e.request,res.clone()));return res;}).catch(()=>caches.match('./'))));});`;
      navigator.serviceWorker.register(URL.createObjectURL(new Blob([sw], { type: 'application/javascript' }))).catch(() => {});
    }

    document.addEventListener('visibilitychange', () => {
      if (document.hidden) saveState();
      else { checkDailyRollover(); syncWakeLock(); render(); }
    });

    loadState();
    syncScreens();
    syncWakeLock();
    render();
  </script>
</body>
</html>
